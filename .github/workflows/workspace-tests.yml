name: Vibe Calling workspace safety

on:
  push:
    branches:
      - main
      - feature/agent-workspace-github-mcp
      - feature/skills-files-mcp-free-models-ui
  pull_request:

jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile server
        run: python -m py_compile server.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run workspace safety tests
        run: python -m unittest discover -s tests -v

  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Windows launcher exists
        shell: pwsh
        run: |
          if (-not (Test-Path "start.bat")) {
            throw "start.bat is missing"
          }
      - name: Launch the actual Windows batch file and check HTTP response
        shell: pwsh
        timeout-minutes: 1
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "vibe-calling-windows-smoke-out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "vibe-calling-windows-smoke-err.log"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "start.bat" -WorkingDirectory $PWD -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "start.bat exited before the local server became ready."
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200 -and $response.Content -match "Vibe Calling") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Vibe Calling did not return its UI over localhost within 30 seconds."
            }
            Write-Host "Windows launcher started Vibe Calling and localhost returned HTTP 200."
          } finally {
            & taskkill.exe /PID $proc.Id /T /F 2>$null | Out-Null
          }
      - name: Compile server on Windows
        run: python -m py_compile server.py
      - name: Check JavaScript syntax on Windows
        run: node --check app.js
      - name: Run workspace safety tests on Windows
        run: python -m unittest discover -s tests -v
