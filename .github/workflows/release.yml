name: Build Vibe Calling release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and tests
        run: |
          python -m py_compile server.py hosted_server.py
          node --check app.js
          python -m unittest discover -s tests -v
      - name: Build Windows ZIP package
        run: |
          mkdir -p release/Vibe-Calling
          cp README.md LICENSE index.html styles.css app.js server.py start.bat HOSTING.md hosted_server.py render.yaml release/Vibe-Calling/
          cp -r skills docs release/Vibe-Calling/
          cd release
          zip -r "Vibe-Calling-$GITHUB_REF_NAME-Windows.zip" Vibe-Calling
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Vibe-Calling-*-Windows.zip
