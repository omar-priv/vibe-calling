services:
  - type: web
    name: vibe-calling-hosted
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m py_compile server.py hosted_server.py && python -m unittest discover -s tests -v
    startCommand: python hosted_server.py
    healthCheckPath: /__health
    disk:
      name: vibe-calling-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: VIBE_ACCESS_PASSWORD
        sync: false
      - key: VIBE_SESSION_SECRET
        generateValue: true
      - key: VIBE_DATA_DIR
        value: /var/data
